<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>CheatSheet — Entwurf „Galerie“</title>
<style>
/* ───────────────────────── Entwurf „Galerie“ ─────────────────────────
   Reines Weiß, das Notenblatt hängt wie ein Werk. Chrome verschwindet.
   Messing (#a8781f) erscheint NUR an lebenden Zuständen.               */

:root {
  --wand: #fbfbfa;
  --papier: #ffffff;
  --tinte: #1c1b19;
  --leise: #8f8c84;
  --haar: rgba(28, 27, 25, 0.12);
  --messing: #a8781f;
  --insel: rgba(252, 252, 251, 0.78);
  --insel-schatten: 0 1px 1px rgba(28,27,25,0.04), 0 14px 44px rgba(28,27,25,0.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body { height: 100%; }
body {
  background: var(--wand);
  color: var(--tinte);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--tinte); outline-offset: 3px; border-radius: 4px; }

/* ── Chrome, das sich zurücknimmt ── */
.chrom { transition: opacity 0.5s ease; }
body.ruhe .chrom { opacity: 0; pointer-events: none; }

/* ── Zurück zur Übersicht (gehört nicht zum Design) ── */
.zurueck {
  position: fixed;
  top: env(safe-area-inset-top);
  left: env(safe-area-inset-left);
  z-index: 60;
  padding: 16px 14px; /* Trefferfläche ≥ 44 px, Schrift bleibt leise */
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--tinte);
  opacity: 0.38;
  text-decoration: none;
}
body.ruhe .zurueck { opacity: 0; }
body.bib-offen .zurueck { visibility: hidden; } /* kollidiert sonst mit dem Bibliothekskopf */
.zurueck:hover { opacity: 0.8; }

/* ── Titel & Seite, so leise wie möglich ── */
.status {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 45;
  display: flex;
  align-items: baseline;
  gap: 10px;
  white-space: nowrap;
  max-width: calc(100vw - 140px);
  overflow: hidden;
  pointer-events: none;
}
.status-titel {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--tinte);
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-seite {
  font-size: 11px;
  color: var(--leise);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* ── Die Bühne: das Blatt hängt im Weißraum ── */
.buehne {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 4.5vmin, 72px);
  padding-top: calc(clamp(16px, 4.5vmin, 72px) + env(safe-area-inset-top) * 0.6);
  padding-bottom: calc(clamp(16px, 4.5vmin, 72px) + env(safe-area-inset-bottom) * 0.6);
}
.papier { width: 100%; height: 100%; }
.papier svg {
  display: block;
  width: 100%;
  height: 100%;
  /* Das Blatt hängt im Weißraum: Schatten folgt dem gemalten Blatt, nicht der Box */
  filter: drop-shadow(0 2px 5px rgba(28, 27, 25, 0.05)) drop-shadow(0 18px 50px rgba(28, 27, 25, 0.09));
}
.papier text { font-family: inherit; }

/* Blätter-Zonen: unsichtbar, halbes Fenster, über dem Blatt */
.zone {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 50%;
  z-index: 10;
  cursor: default;
}
.zone-links { left: 0; }
.zone-rechts { right: 0; }
.zone:focus-visible {
  outline: 2px solid rgba(28, 27, 25, 0.55);
  outline-offset: -8px;
  border-radius: 18px;
}

/* ── Untere Leiste: kleine schwebende Insel ── */
.leiste {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  gap: 2px;
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--insel);
  -webkit-backdrop-filter: blur(18px) saturate(1.1);
  backdrop-filter: blur(18px) saturate(1.1);
  box-shadow: var(--insel-schatten);
}
.leiste button {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 84px;
  min-height: 54px;
  padding: 8px 0 7px;
  border-radius: 999px;
  color: var(--tinte);
  opacity: 0.62;
  transition: opacity 0.2s ease;
}
.leiste button:hover { opacity: 0.9; }
.leiste button.an { opacity: 1; background: rgba(28, 27, 25, 0.055); }
.leiste button svg { display: block; }
.leiste button span.beschriftung {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
/* Lebender Zustand: kleiner Messing-Punkt am Knopf */
.punkt {
  position: absolute;
  top: 8px;
  right: 24px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--messing);
}
.punkt.puls { animation: punktpuls 1.1s ease-in-out infinite; }
@keyframes punktpuls {
  50% { transform: scale(1.6); opacity: 0.7; }
}

/* ── Schwebende Werkzeuge über den Noten ── */
.werkzeuge {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  width: min(372px, calc(100vw - 20px));
  pointer-events: none;
}
.widget {
  pointer-events: auto;
  background: var(--insel);
  -webkit-backdrop-filter: blur(18px) saturate(1.1);
  backdrop-filter: blur(18px) saturate(1.1);
  box-shadow: var(--insel-schatten);
  border-radius: 20px;
  padding: 10px 16px 14px;
  animation: auftauchen 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes auftauchen {
  from { opacity: 0; transform: translateY(10px); }
}
.w-kopf {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.w-titel {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--leise);
}
.w-zu {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin: -8px -14px -10px 0;
  color: var(--leise);
  border-radius: 50%;
}
.w-zu:hover { color: var(--tinte); }

/* Metronom */
.m-mitte {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  margin-top: 2px;
}
.m-bpm { text-align: center; line-height: 1; }
.m-bpm strong {
  display: block;
  font-size: 36px;
  font-weight: 640;
  letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums;
}
.m-bpm .m-einheit {
  display: block;
  margin-top: 4px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--leise);
}
.rund {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--tinte);
}
.rund:hover { background: rgba(28, 27, 25, 0.05); }
.rund:active { background: rgba(28, 27, 25, 0.09); }
.m-fuss {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
}
.m-start {
  min-width: 84px;
  height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  background: var(--tinte);
  color: var(--papier);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.m-prozent {
  height: 44px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--leise);
}
.m-prozent:hover { color: var(--tinte); }
.m-takt {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
}
.m-takt i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid rgba(28, 27, 25, 0.35);
  background: transparent;
  transition: transform 0.09s ease, background-color 0.09s ease, border-color 0.09s ease, box-shadow 0.09s ease;
}
.m-takt i.an {
  background: var(--messing);
  border-color: var(--messing);
  transform: scale(1.2);
}
.m-takt i.an.eins { box-shadow: 0 0 0 4px rgba(168, 120, 31, 0.16); }
.m-takt .m-taktart {
  font-size: 11px;
  color: var(--leise);
  font-variant-numeric: tabular-nums;
  margin-left: 2px;
}

/* Stimmgerät */
.s-mitte {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 4px;
}
.s-ton {
  flex-shrink: 0;
  min-width: 56px;
  text-align: center;
  line-height: 1;
}
.s-ton strong {
  font-size: 46px;
  font-weight: 640;
  letter-spacing: -0.02em;
}
.s-ton sub {
  font-size: 15px;
  font-weight: 500;
  color: var(--leise);
  margin-left: 1px;
}
.s-rechts { flex: 1; min-width: 0; }
.s-skala { display: block; width: 100%; height: 46px; }
.s-nadel { animation: wackeln 2.6s ease-in-out infinite; }
@keyframes wackeln {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(1.8px); }
  65% { transform: translateX(-1.3px); }
}
.s-ablese {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 2px;
  justify-content: center;
}
.s-abw {
  font-size: 17px;
  font-weight: 640;
  font-variant-numeric: tabular-nums;
}
.s-zustand {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--leise);
}

/* ── Bibliothek: ein Schleier über den Noten ── */
.bib {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(252, 252, 251, 0.92);
  -webkit-backdrop-filter: blur(22px) saturate(1.05);
  backdrop-filter: blur(22px) saturate(1.05);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: schleier 0.25s ease;
}
@keyframes schleier { from { opacity: 0; } }
.bib-innen {
  max-width: 560px;
  min-height: 100%;
  margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}
.bib-kopf {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bib-kopf h2 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}
.bib-zu {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-right: -12px;
  color: var(--leise);
  border-radius: 50%;
}
.bib-zu:hover { color: var(--tinte); }
.suche {
  width: 100%;
  margin: 26px 0 10px;
  padding: 13px 2px; /* Trefferfläche ≥ 44 px */
  font: inherit;
  font-size: 16px;
  color: var(--tinte);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--haar);
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
}
.suche::placeholder { color: var(--leise); }
.suche:focus { outline: none; border-bottom-color: var(--tinte); }
.liste { list-style: none; flex: 1; }
.liste button {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 14px;
  min-height: 48px;
  padding: 13px 2px;
  text-align: left;
  border-radius: 6px;
}
.liste button:hover .stueck-titel { color: var(--tinte); }
.stueck-titel {
  font-size: 17px;
  font-weight: 420;
  letter-spacing: 0.005em;
  color: rgba(28, 27, 25, 0.82);
}
.stueck-genre {
  margin-left: auto;
  flex-shrink: 0;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--leise);
}
.liste button.aktuell { position: relative; }
.liste button.aktuell .stueck-titel { font-weight: 640; color: var(--tinte); }
.liste button.aktuell::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tinte);
}
.bib-leer {
  padding: 20px 2px;
  font-size: 13px;
  color: var(--leise);
}
.bib-fuss {
  margin-top: auto;
  padding-top: 32px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--leise);
}

/* ── Ruhe bitte: reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<a class="zurueck chrom" href="./">Übersicht</a>

<div class="status chrom" id="status" aria-live="polite">
  <span class="status-titel" id="statusTitel">Böhmischer Traum</span>
  <span class="status-seite" id="statusSeite">Seite 2/5</span>
</div>

<main class="buehne" aria-label="Notenansicht">
  <div class="papier" id="papier"></div>
</main>

<button class="zone zone-links" id="zoneLinks" type="button" aria-label="Vorherige Seite"></button>
<button class="zone zone-rechts" id="zoneRechts" type="button" aria-label="Nächste Seite"></button>

<div class="werkzeuge">

  <section class="widget" id="wMetro" role="group" aria-label="Metronom" hidden>
    <div class="w-kopf">
      <span class="w-titel">Metronom</span>
      <button class="w-zu" type="button" id="metroZu" aria-label="Metronom schließen">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="m-mitte">
      <button class="rund" type="button" id="mMinus" aria-label="Ein Schlag pro Minute langsamer">−1</button>
      <div class="m-bpm">
        <strong id="mBpm">112</strong>
        <span class="m-einheit">BPM</span>
      </div>
      <button class="rund" type="button" id="mPlus" aria-label="Ein Schlag pro Minute schneller">+1</button>
    </div>
    <div class="m-fuss">
      <button class="m-start" type="button" id="mStart" aria-pressed="true">Stopp</button>
      <button class="m-prozent" type="button" id="mProzMinus" aria-label="Tempo zehn Prozent langsamer">−10&nbsp;%</button>
      <button class="m-prozent" type="button" id="mProzPlus" aria-label="Tempo zehn Prozent schneller">+10&nbsp;%</button>
      <div class="m-takt" aria-label="Takt zwei Viertel">
        <i id="mDot1"></i><i id="mDot2"></i>
        <span class="m-taktart">2/4</span>
      </div>
    </div>
  </section>

  <section class="widget" id="wStimm" role="group" aria-label="Stimmgerät" hidden>
    <div class="w-kopf">
      <span class="w-titel">Stimmgerät</span>
      <button class="w-zu" type="button" id="stimmZu" aria-label="Stimmgerät schließen">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="s-mitte">
      <div class="s-ton"><strong>B</strong><sub>3</sub></div>
      <div class="s-rechts">
        <svg class="s-skala" id="sSkala" viewBox="0 0 240 46" aria-hidden="true"></svg>
        <div class="s-ablese">
          <span class="s-abw" id="sAbw">+2</span>
          <span class="s-zustand">fast rein</span>
        </div>
      </div>
    </div>
  </section>

</div>

<nav class="leiste chrom" aria-label="Werkzeugleiste">
  <button type="button" id="kNoten" aria-expanded="false" aria-controls="bib">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 17.4V6.2l10-2v11.2"/>
      <ellipse cx="6.6" cy="17.6" rx="2.6" ry="2.1" fill="currentColor" stroke="none"/>
      <ellipse cx="16.6" cy="15.6" rx="2.6" ry="2.1" fill="currentColor" stroke="none"/>
    </svg>
    <span class="beschriftung">Noten</span>
  </button>
  <button type="button" id="kMetro" aria-pressed="false">
    <span class="punkt" id="pMetro" hidden></span>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.2 3.5h5.6l2.9 17H6.3z"/>
      <path d="M12 16.5L16.9 7"/>
      <circle cx="16.9" cy="7" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
    <span class="beschriftung">Metronom</span>
  </button>
  <button type="button" id="kStimm" aria-pressed="false">
    <span class="punkt" id="pStimm" hidden></span>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 3.5v6a3.5 3.5 0 0 0 7 0v-6"/>
      <path d="M12 13v6.5"/>
      <path d="M9.5 20.5h5"/>
    </svg>
    <span class="beschriftung">Stimmgerät</span>
  </button>
</nav>

<div class="bib" id="bib" role="dialog" aria-modal="true" aria-label="Bibliothek" hidden>
  <div class="bib-innen">
    <div class="bib-kopf">
      <h2>Bibliothek</h2>
      <button class="bib-zu" type="button" id="bibZu" aria-label="Bibliothek schließen">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <input class="suche" id="suche" type="search" placeholder="Suchen …" aria-label="Stücke durchsuchen" autocomplete="off">
    <ul class="liste" id="liste"></ul>
    <p class="bib-fuss">Alles bleibt auf diesem Gerät. Kein Konto, kein Server.</p>
  </div>
</div>

<noscript><p style="position:fixed;top:40%;width:100%;text-align:center;color:#8f8c84;">Dieses Mockup benötigt JavaScript.</p></noscript>

<script>
"use strict";

/* ───────── Daten ───────── */
var STUECKE = [
  { titel: "Böhmischer Traum", gattung: "Polka", komponist: "Norbert Gälle", tempo: 112 },
  { titel: "Dem Land Tirol die Treue", gattung: "Marsch", komponist: "Florian Pedarnig", tempo: 116 },
  { titel: "Auf der Vogelwiese", gattung: "Polka", komponist: "Josef Poncar", tempo: 120 },
  { titel: "Egerländer Musikanten-Marsch", gattung: "Marsch", komponist: "", tempo: 112 },
  { titel: "Von Freund zu Freund", gattung: "Polka", komponist: "Martin Scharnagl", tempo: 108 },
  { titel: "Kaiserin Sissi", gattung: "Walzer", komponist: "Timo Dellweg", tempo: 84 },
  { titel: "Wir Musikanten", gattung: "Polka", komponist: "", tempo: 116 }
];
var SEITEN = 5;
var TINTE = "#1c1b19";
var LEISE = "#8f8c84";

var zustand = {
  stueck: 0,
  seite: 2,
  bpm: 112,
  metroOffen: false,
  metroLaeuft: false,
  stimmOffen: false,
  bibOffen: false
};

/* ───────── Deterministischer Zufall (Seite × Stück) ───────── */
function rng(seed) {
  var t = seed >>> 0;
  return function () {
    t += 0x6D2B79F5;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────── Notenblatt, prozedural ───────── */
function schluessel(x, y0) {
  // Stilisierter Violinschlüssel: Spirale um die G-Linie + geschwungener Stiel
  return '<g transform="translate(' + x + ',' + y0 + ')" fill="none" stroke="' + TINTE + '" stroke-linecap="round">' +

/* ───────── Anzeige ───────── */
function zeichnen() {
  elPapier.innerHTML = baueBlatt(zustand.stueck, zustand.seite);
  elStatusTitel.textContent = STUECKE[zustand.stueck].titel;
  elStatusSeite.textContent = "Seite " + zustand.seite + "/" + SEITEN;

  var neu = Math.min(SEITEN, Math.max(1, zustand.seite + richtung));

/* ───────── Chrome, das sich zurücknimmt ───────── */
var ruheTimer = null;
function wach() {
  document.body.classList.remove("ruhe");
  if (ruheTimer) clearTimeout(ruheTimer);
  if (ruhigeBewegung || zustand.bibOffen) return; // bleibt einfach sichtbar
  ruheTimer = setTimeout(function () {
    document.body.classList.add("ruhe");

}
document.addEventListener("pointerdown", wach, true);

document.addEventListener("focusin", wach, true);

$("mMinus").addEventListener("click", function () { bpmSetzen(zustand.bpm - 1); });
$("mPlus").addEventListener("click", function () { bpmSetzen(zustand.bpm + 1); });
$("mProzMinus").addEventListener("click", function () { bpmSetzen(zustand.bpm * 0.9); });
$("mProzPlus").addEventListener("click", function () { bpmSetzen(zustand.bpm * 1.1); });

/* ───────── Stimmgerät: feine Skala mit Nadel ───────── */
function baueSkala() {
  var s = [], mitte = 120, b = 2.1, abw = 2; // +2, fast rein
  for (var c = -50; c <= 50; c += 5) {
    var x = mitte + c * b;
    var h = c === 0 ? 17 : (c % 10 === 0 ? 11 : 7);
    var farbe = c === 0 ? TINTE : "rgba(28,27,25,0.28)";
    s.push('<line x1="' + x + '" y1="' + (36 - h) + '" x2="' + x + '" y2="36" stroke="' + farbe + '" stroke-width="' + (c === 0 ? 1.4 : 1) + '"/>');
  }
  s.push('<text x="' + (mitte - 50 * b) + '" y="45" text-anchor="middle" font-size="7.5" fill="' + LEISE + '">−50</text>');
  s.push('<text x="' + (mitte + 50 * b) + '" y="45" text-anchor="middle" font-size="7.5" fill="' + LEISE + '">+50</text>');
  // Lebender Zustand: die Nadel trägt das Messing
  var nx = mitte + abw * b;
  s.push('<g class="s-nadel">' +
    '<line x1="' + nx + '" y1="8" x2="' + nx + '" y2="36" stroke="#a8781f" stroke-width="2" stroke-linecap="round"/>' +
    '<circle cx="' + nx + '" cy="6" r="2.4" fill="#a8781f"/>' +
    '</g>');
  $("sSkala").innerHTML = s.join("");
}

/* ───────── Lebende Zustände an der Leiste (nur dort Messing) ───────── */
function lebendeZustaende() {
  pMetro.hidden = !zustand.metroLaeuft;
  pMetro.classList.toggle("puls", zustand.metroLaeuft && !ruhigeBewegung);
  pStimm.hidden = !zustand.stimmOffen;
}

/* ───────── Widgets & Leiste ───────── */
function metroZeigen(an) {
  zustand.metroOffen = an;
  wMetro.hidden = !an;
  kMetro.setAttribute("aria-pressed", String(an));
  kMetro.classList.toggle("an", an);
}
function stimmZeigen(an) {
  zustand.stimmOffen = an;
  wStimm.hidden = !an;
  kStimm.setAttribute("aria-pressed", String(an));
  kStimm.classList.toggle("an", an);
  lebendeZustaende();
}
kMetro.addEventListener("click", function () { metroZeigen(!zustand.metroOffen); });
kStimm.addEventListener("click", function () { stimmZeigen(!zustand.stimmOffen); });
$("metroZu").addEventListener("click", function () { metroZeigen(false); });
$("stimmZu").addEventListener("click", function () { stimmZeigen(false); });

/* ───────── Bibliothek ───────── */
function baueListe(filter) {
  var f = (filter || "").trim().toLowerCase();
  var teile = [];
  STUECKE.forEach(function (st, i) {
    if (f && st.titel.toLowerCase().indexOf(f) < 0 && st.gattung.toLowerCase().indexOf(f) < 0) return;
    teile.push('<li><button type="button" data-i="' + i + '" class="' + (i === zustand.stueck ? "aktuell" : "") + '"' +
      (i === zustand.stueck ? ' aria-current="true"' : "") + '>' +
      '<span class="stueck-titel">' + st.titel + '</span>' +
      '<span class="stueck-genre">' + st.gattung + '</span>' +
      '</button></li>');
  });
  liste.innerHTML = teile.length ? teile.join("") : '<li class="bib-leer">Nichts gefunden.</li>';
}
function bibZeigen(an) {
  var fokusDrin = document.activeElement && bib.contains(document.activeElement);
  zustand.bibOffen = an;
  bib.hidden = !an;
  document.body.classList.toggle("bib-offen", an);
  kNoten.setAttribute("aria-expanded", String(an));
  kNoten.classList.toggle("an", an);
  if (an) { baueListe(suche.value); wach(); $("bibZu").focus(); }
  else if (fokusDrin) { kNoten.focus(); }
}
kNoten.addEventListener("click", function () { bibZeigen(!zustand.bibOffen); });
$("bibZu").addEventListener("click", function () { bibZeigen(false); });
suche.addEventListener("input", function () { baueListe(suche.value); });
liste.addEventListener("click", function (ev) {
  var knopf = ev.target.closest("button[data-i]");
  if (!knopf) return;
  var i = parseInt(knopf.getAttribute("data-i"), 10);
  if (i !== zustand.stueck) { zustand.stueck = i; zustand.seite = 1; zeichnen(); }
  bibZeigen(false);
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && zustand.bibOffen) bibZeigen(false);
});

/* ───────── Blättern: Tipp auf linke/rechte Blatthälfte ───────── */
$("zoneLinks").addEventListener("click", function () { blaettern(-1); });
$("zoneRechts").addEventListener("click", function () { blaettern(1); });
document.addEventListener("keydown", function (ev) {
  if (zustand.bibOffen) return;
  if (ev.key === "ArrowLeft") blaettern(-1);
  if (ev.key === "ArrowRight") blaettern(1);
});

/* ───────── Start: Seite 2, Metronom offen und läuft (112, 2/4) ───────── */
zeichnen();
baueSkala();
baueListe("");
metroZeigen(true);
metroStartStopp(true);
wach();
</script>
