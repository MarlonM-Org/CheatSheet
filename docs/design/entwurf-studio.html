<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CheatSheet – Entwurf „Studio“</title>
<style>
/* ════════════════════════════════════════════════════════════════
   ENTWURF „STUDIO“ — präzise, sachlich, werkzeughaft.
   Helles Studio-Weiß, warm abgestufte Neutrale, Haarlinien statt
   Schatten, Messing (#a8781f) als einziger Akzent.
   Bewusst NUR hell — Themes zieht das Projekt später nach.
   ════════════════════════════════════════════════════════════════ */
:root {
  --weiss:    #fcfcfb;   /* Grund: Blatt und Chrome verschmelzen   */
  --flaeche:  #f5f4f0;   /* eine Tonwert-Stufe tiefer              */
  --flaeche2: #edebe4;   /* zwei Stufen tiefer (inaktive Punkte)   */
  --haar:     #e4e2db;   /* Haarlinie                              */
  --haar2:    #cbc8bf;   /* Haarlinie, kräftig (Bedienelemente)    */
  --tinte:    #1d1b17;
  --grau1:    #57534a;   /* Sekundärtext                           */
  --grau2:    #8d887c;   /* Mikro-Labels, Tertiäres                */
  --messing:  #a8781f;   /* EINZIGER Akzent                        */
  --bar: 58px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; background: #fcfcfb; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--weiss);
  color: var(--tinte);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--messing); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Mikro-Label: Versalien, gesperrt */
.ml {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--grau2);
}

/* ── Grundgerüst ───────────────────────────────────────────────── */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#buehne {
  position: relative;
  flex: 1;
  min-height: 0;
  /* Blatt beginnt oben wie eine aufgelegte Stimme — Restluft bleibt
     unten und verschwindet unter den angedockten Panels */
  padding-top: calc(env(safe-area-inset-top, 0px) + 34px);
  cursor: pointer;
}
#blatt { display: block; width: 100%; height: 100%; }

/* dezente Navigation zwischen den Entwürfen — gehört nicht zum Design */
.zurueck {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 2px;
  z-index: 60;
  display: inline-flex;
  align-items: center;
  min-height: 44px;              /* volle Trefferfläche, optisch bleibt nur die Zeile */
  padding: 2px 12px 0;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--grau2);
  opacity: 0.5;
  text-decoration: none;
}
.zurueck:hover { opacity: 0.9; }

/* ── Titel-/Seitenstatus: sitzt am Rand, erscheint nur kurz ────── */
.status {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: 14px;
  z-index: 55;
  text-align: right;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.45s ease;
}
.status.da { opacity: 1; }
.status .t {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--tinte);
}
.status .m {
  display: block;
  margin-top: 3px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--grau2);
  font-variant-numeric: tabular-nums;
}

/* ── Untere Leiste: vollbreit, randlos, eine Haarlinie ─────────── */
.leiste {
  position: relative;
  z-index: 50;
  flex: none;
  background: var(--weiss);
  border-top: 1px solid var(--haar);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.leiste-innen { display: flex; max-width: 560px; margin: 0 auto; }
.leiste-innen button {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: var(--bar);
  color: var(--grau1);
}
.leiste-innen button svg {
  width: 23px; height: 23px;
  stroke: currentColor; fill: none;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
}
.leiste-innen button .bl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.leiste-innen button:active { background: var(--flaeche); }
.leiste-innen button[aria-pressed="true"] { color: var(--messing); }
.leiste-innen button[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  top: -1px; left: 50%;
  transform: translateX(-50%);
  width: 34px; height: 2px;
  background: var(--messing);
}
/* Läuft-Punkt am Metronom-Knopf (zeigt den Lauf auch bei zugeklapptem Widget) */
.mlauf {
  position: absolute;
  top: 9px; left: calc(50% + 14px);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--messing);
  opacity: 0;
  transition: opacity 0.2s;
}
body.laeuft .mlauf { opacity: 1; }

/* ── Angedockte flache Panels ──────────────────────────────────── */
#dock {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  display: flex;
  flex-direction: column;
}
.panel {
  background: var(--weiss);
  border-top: 1px solid var(--haar);
  box-shadow: 0 -12px 32px rgb(29 27 23 / 5%);
}
.panel-kopf {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 0;
}
.panel-kopf h2 {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--grau2);
}
.panel-kopf.linie { padding-bottom: 10px; border-bottom: 1px solid var(--haar); }
.schliessen {
  margin: -8px -10px -8px auto;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  color: var(--grau2);
  border-radius: 4px;
}
.schliessen:hover { color: var(--tinte); }
.schliessen svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; fill: none; }

/* ── Metronom-Widget ───────────────────────────────────────────── */
.m-zeile1 { display: flex; align-items: center; gap: 14px; padding: 8px 14px 2px; }
#mStart {
  flex: none;
  width: 50px; height: 50px;
  display: grid; place-items: center;
  border: 1px solid var(--haar2);
  border-radius: 5px;
  background: var(--weiss);
  color: var(--tinte);
}
#mStart svg { width: 20px; height: 20px; }
#mStart[aria-pressed="true"] { background: var(--messing); border-color: var(--messing); color: #ffffff; }
#mStart:not([aria-pressed="true"]) .i-stop { display: none; }
#mStart[aria-pressed="true"] .i-play { display: none; }
.m-bpm { display: flex; align-items: baseline; gap: 7px; }
#mZahl {
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--tinte);
}
.m-einheit { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: var(--grau2); }
.m-takt {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.m-taktlabel {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--grau2);
  font-variant-numeric: tabular-nums;
}
.m-punkte { display: flex; gap: 8px; }
.m-punkte i {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--flaeche2);
  border: 1px solid var(--haar2);
}
.m-punkte i.an { border-color: transparent; animation: pop 0.18s ease-out; }
.m-punkte i.an.eins { background: var(--messing); }
.m-punkte i.an.zwei { background: var(--tinte); }
@keyframes pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
.m-zeile2 { display: flex; gap: 10px; padding: 12px 14px 14px; }
.gruppe {
  display: flex;
  flex: 1;
  border: 1px solid var(--haar2);
  border-radius: 5px;
  overflow: hidden;
}
.gruppe button {
  flex: 1;
  height: 44px;
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--tinte);
  background: var(--weiss);
}
.gruppe button + button { border-left: 1px solid var(--haar2); }
.gruppe button:active { background: var(--flaeche); }

/* ── Stimmgerät-Widget ─────────────────────────────────────────── */
.s-zeile { display: flex; align-items: center; gap: 16px; padding: 10px 14px 14px; }
.s-ton {
  flex: none;
  min-width: 54px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  font-size: 40px;
  font-weight: 700;
  line-height: 1;
  color: var(--messing);          /* erkannter Ton = Akzent */
}
.s-okt { font-size: 14px; font-weight: 600; margin-left: 2px; color: var(--messing); }
.s-skala { flex: 1; min-width: 0; }
.s-skala svg { display: block; width: 100%; height: auto; }
.s-wert { flex: none; min-width: 50px; text-align: right; }
.s-abw {
  display: block;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--tinte);
}
.s-zustand {
  display: block;
  margin-top: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--grau2);
}
.wobbel { animation: wobbel 2.4s ease-in-out infinite alternate; }
@keyframes wobbel {
  from { transform: translateX(-0.9px); }
  to   { transform: translateX(0.9px); }
}

/* ── Bibliothek: Overlay über den Noten, flach angedockt ───────── */
#bibliothek {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px));
  z-index: 45;
  display: flex;
  flex-direction: column;
  background: var(--weiss);
  border-top: 1px solid var(--haar);
  box-shadow: 0 -12px 40px rgb(29 27 23 / 7%);
  max-height: calc(100vh - var(--bar) - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px) - 64px);
  max-height: calc(100dvh - var(--bar) - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px) - 64px);
}
.bib-anzahl {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--grau2);
  font-variant-numeric: tabular-nums;
}
#bibliothek .schliessen { margin-left: 4px; }
.bib-suche { position: relative; padding: 10px 14px; border-bottom: 1px solid var(--haar); }
.bib-suche svg {
  position: absolute;
  left: 27px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  stroke: var(--grau2); stroke-width: 1.6; stroke-linecap: round; fill: none;
  pointer-events: none;
}
.bib-suche input {
  width: 100%;
  height: 44px;
  padding: 0 12px 0 38px;
  border: 1px solid var(--haar2);
  border-radius: 5px;
  background: var(--flaeche);
  color: var(--tinte);
  font-size: 15px;
  -webkit-appearance: none;
  appearance: none;
}
.bib-suche input::placeholder { color: var(--grau2); }
.bib-liste { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.stueck {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 8px 14px 8px 18px;
  text-align: left;
  border-bottom: 1px solid var(--haar);
}
.stueck:active { background: var(--flaeche); }
.stueck .st { font-size: 15px; font-weight: 500; color: var(--tinte); }
.stueck .sg {
  margin-left: auto;
  flex: none;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--grau2);
  border: 1px solid var(--haar);
  border-radius: 3px;
  padding: 3px 7px;
}
.stueck.aktiv::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: -1px;
  width: 2px;
  background: var(--messing);
}
.stueck.aktiv .st { font-weight: 700; }
.bib-fuss {
  padding: 10px 14px;
  border-top: 1px solid var(--haar);
  font-size: 11px;
  line-height: 1.45;
  color: var(--grau2);
}

/* ── Desktop: Panels docken rechts bzw. links an ───────────────── */
@media (min-width: 740px) {
  #dock { left: auto; width: 400px; }
  #dock .panel { border-left: 1px solid var(--haar); }
  #bibliothek { right: auto; width: 460px; border-right: 1px solid var(--haar); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<a class="zurueck" href="./">Übersicht</a>

<div class="app">
  <main id="buehne" aria-label="Notenblatt. Tipp links: vorherige Seite, Tipp rechts: nächste Seite.">
    <svg id="blatt" viewBox="0 0 760 1075" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Notenseite"></svg>
  </main>

  <nav class="leiste" aria-label="Werkzeuge">
    <div class="leiste-innen">
      <button id="kNoten" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8 8h8M8 11h8M8 14h8M8 17h8"/></svg>
        <span class="bl">Noten</span>
      </button>
      <button id="kMetronom" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 3.5h5.4l3.5 16H5.8l3.5-16z"/><path d="M6.9 15.5h10.2"/><path d="M12 15.5l4-8.2"/><circle cx="16.4" cy="6.5" r="1.4"/></svg>
        <span class="bl">Metronom</span>
        <span class="mlauf" aria-hidden="true"></span>
      </button>
      <button id="kStimm" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5v5.7a4 4 0 0 0 8 0V3.5"/><path d="M12 13.2v5.3"/><path d="M9.3 20.5h5.4"/></svg>
        <span class="bl">Stimmgerät</span>
      </button>
    </div>
  </nav>
</div>

<div class="status" id="status" aria-live="polite">
  <span class="t" id="statusTitel"></span>
  <span class="m" id="statusMeta"></span>
</div>

<div id="dock">

  <section class="panel" id="wStimm" role="region" aria-label="Stimmgerät" hidden>
    <div class="panel-kopf">
      <h2>Stimmgerät</h2>
      <button class="schliessen" type="button" data-ziel="stimm" aria-label="Stimmgerät schließen">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div class="s-zeile">
      <div class="s-ton" aria-label="Erkannter Ton B, Oktave 3">B<span class="s-okt">3</span></div>
      <div class="s-skala"><svg id="sSkala" viewBox="0 0 220 44" aria-hidden="true"></svg></div>
      <div class="s-wert">
        <span class="s-abw">+2</span>
        <span class="s-zustand">Fast rein</span>
      </div>
    </div>
  </section>

  <section class="panel" id="wMetro" role="region" aria-label="Metronom">
    <div class="panel-kopf">
      <h2>Metronom</h2>
      <button class="schliessen" type="button" data-ziel="metronom" aria-label="Metronom schließen">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div class="m-zeile1">
      <button id="mStart" type="button" aria-pressed="true" aria-label="Metronom stoppen">
        <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor"/></svg>
        <svg class="i-stop" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5.5v9M13 5.5v9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="m-bpm"><span id="mZahl">112</span><span class="m-einheit">BPM</span></div>
      <div class="m-takt">
        <span class="m-taktlabel">Takt 2/4</span>
        <div class="m-punkte" aria-hidden="true"><i id="p1"></i><i id="p2"></i></div>
      </div>
    </div>
    <div class="m-zeile2">
      <div class="gruppe">
        <button id="mM1" type="button" aria-label="Ein Schlag langsamer">−1</button>
        <button id="mP1" type="button" aria-label="Ein Schlag schneller">+1</button>
      </div>
      <div class="gruppe">
        <button id="mM10" type="button" aria-label="Zehn Prozent langsamer">−10 %</button>
        <button id="mP10" type="button" aria-label="Zehn Prozent schneller">+10 %</button>
      </div>
    </div>
  </section>

</div>

<section id="bibliothek" role="region" aria-label="Bibliothek" hidden>
  <div class="panel-kopf linie">
    <h2>Bibliothek</h2>
    <span class="bib-anzahl">7 Stücke</span>
    <button class="schliessen" type="button" data-ziel="noten" aria-label="Bibliothek schließen">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div class="bib-suche">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5"/><path d="M13 13l4 4"/></svg>
    <input id="suche" type="search" placeholder="Stücke durchsuchen" aria-label="Stücke durchsuchen">
  </div>
  <div class="bib-liste" id="bibListe"></div>
  <div class="bib-fuss">Alles bleibt auf diesem Gerät. Kein Konto, kein Server.</div>
</section>

<script>
"use strict";

/* ── Daten ──────────────────────────────────────────────────────── */
const STUECKE = [
  { t: "Böhmischer Traum",             g: "Polka",  k: "Norbert Gälle" },
  { t: "Dem Land Tirol die Treue",     g: "Marsch", k: "Florian Pedarnig" },
  { t: "Auf der Vogelwiese",           g: "Polka",  k: "Josef Poncar" },
  { t: "Egerländer Musikanten-Marsch", g: "Marsch", k: "" },
  { t: "Von Freund zu Freund",         g: "Polka",  k: "Martin Scharnagl" },
  { t: "Kaiserin Sissi",               g: "Walzer", k: "Timo Dellweg" },
  { t: "Wir Musikanten",               g: "Polka",  k: "" }
];
const TEMPO = { Polka: 112, Marsch: 116, Walzer: 138 };
const SEITEN = 5;
let stueck = 0;
let seite = 2;

const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(id) { return document.getElementById(id); }
function klemm(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* Deterministischer Zufall (mulberry32) — Blatt je Stück+Seite stabil */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ════════════════════════════════════════════════════════════════
   PROZEDURALES NOTENBLATT
   viewBox 760 × 1075 (A4-Verhältnis), Rand 56, Liniengap 7.
   ════════════════════════════════════════════════════════════════ */
const INK = "#23211c";
const SERIF = "Georgia, 'Times New Roman', serif";

/* Violinschlüssel: Spirale parametrisch erzeugt, Körper + Schaft als
   zwei kurze Kurven. Lokale Koordinaten: Systemoberkante = y 0. */
const CLEF = (function () {
  const cx = 10.3, cy = 22, a0 = -Math.PI / 3, umlauf = 0.92, r0 = 5.9, r1 = 1.6, n = 46;
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = a0 + t * umlauf * 2 * Math.PI, r = r0 + (r1 - r0) * t;
    p.push((i === 0 ? "M" : "L") + (cx + r * Math.cos(a)).toFixed(2) + " " + (cy + r * Math.sin(a)).toFixed(2));
  }
  const ea = a0 + umlauf * 2 * Math.PI;
  const ex = (cx + r1 * Math.cos(ea)).toFixed(2), ey = (cy + r1 * Math.sin(ea)).toFixed(2);
  return `<path d="M13.5 -7 C15.7 -4 15.7 -0.5 13.4 2.3 C10.6 5.6 8.5 8.8 8.3 12.4 C8.2 15.2 10 16.5 13.25 16.89" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/>` +
    `<path d="${p.join(" ")}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<circle cx="${ex}" cy="${ey}" r="1.15" fill="${INK}"/>` +
    `<path d="M13.5 -7 C12 -3 11.4 1.5 11.6 5.5 L12.5 30.5 C12.8 33.5 11.3 35.4 9.2 35.1 C7.4 34.8 6.6 33.1 7.5 31.8" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>` +
    `<circle cx="8.3" cy="33.3" r="1.25" fill="${INK}"/>`;
})();

function txt(x, y, inhalt, gr, extra, farbe) {
  return `<text x="${x}" y="${y}" font-family="${SERIF}" font-size="${gr}" fill="${farbe || INK}"${extra || ""}>${inhalt}</text>`;
}

/* B-Vorzeichen auf einer Linie (y = Linienmitte) */
function be(x, y) {
  return `<path d="M${x} ${y - 8.5} L${x} ${y + 3.2}" fill="none" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/>` +
    `<path d="M${x} ${y + 3.2} C${x + 4.4} ${y + 0.8} ${x + 3.8} ${y - 2.8} ${x} ${y - 0.8}" fill="none" stroke="${INK}" stroke-width="1.3"/>`;
}

function kopfM(x, y, offen) {
  return offen
    ? `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.9" transform="rotate(-14 ${x} ${y})" fill="none" stroke="${INK}" stroke-width="1.5"/>`
    : `<ellipse cx="${x}" cy="${y}" rx="3.9" ry="2.9" transform="rotate(-14 ${x} ${y})" fill="${INK}"/>`;
}

function einzelHals(o, n, fahne) {
  const oben = n.step < 4;
  const sx = oben ? n.x + 3.5 : n.x - 3.5;
  const tip = oben ? n.y - 23 : n.y + 23;
  o.push(`<line x1="${sx}" y1="${oben ? n.y - 1 : n.y + 1}" x2="${sx}" y2="${tip}" stroke="${INK}" stroke-width="1.3"/>`);
  if (fahne) {
    o.push(oben
      ? `<path d="M${sx} ${tip} C${sx + 4.6} ${tip + 3.4} ${sx + 5} ${tip + 8} ${sx + 2.2} ${tip + 12.4}" fill="none" stroke="${INK}" stroke-width="1.5"/>`
      : `<path d="M${sx} ${tip} C${sx + 4.6} ${tip - 3.4} ${sx + 5} ${tip - 8} ${sx + 2.2} ${tip - 12.4}" fill="none" stroke="${INK}" stroke-width="1.5"/>`);
  }
}

/* Balkengruppe: flacher Balken mit begrenzter Neigung, Hälse angepasst.
   Gibt die Unterkante zurück, damit Dynamik/Gabeln nicht hineinlaufen. */
function balken(o, g) {
  const oben = g[0].step < 4;
  const sgn = oben ? -1 : 1;
  const dx = oben ? 3.5 : -3.5;
  const x1 = g[0].x + dx, xN = g[g.length - 1].x + dx;
  const spann = (xN - x1) || 1;
  const s = klemm((g[g.length - 1].y - g[0].y) * 0.35, -4.5, 4.5);
  let A = oben ? Infinity : -Infinity;
  g.forEach(nt => {
    const f = (nt.x + dx - x1) / spann;
    const kand = nt.y + sgn * 23 - s * f;
    A = oben ? Math.min(A, kand) : Math.max(A, kand);
  });
  g.forEach(nt => {
    const f = (nt.x + dx - x1) / spann;
    const by = (A + s * f).toFixed(1);
    o.push(`<line x1="${nt.x + dx}" y1="${oben ? nt.y - 1 : nt.y + 1}" x2="${nt.x + dx}" y2="${by}" stroke="${INK}" stroke-width="1.3"/>`);
  });
  o.push(`<line x1="${x1}" y1="${A.toFixed(1)}" x2="${xN}" y2="${(A + s).toFixed(1)}" stroke="${INK}" stroke-width="3.4"/>`);
  return Math.max(A, A + s) + 2;
}

/* Legatobogen; gibt die Unterkante zurück (0, wenn er oben liegt) */
function bogen(o, k) {
  const stieleUnten = k[0].step >= 4;
  const x1 = k[0].x, xN = k[k.length - 1].x;
  if (stieleUnten) {
    const top = Math.min.apply(null, k.map(n => n.y));
    o.push(`<path d="M${x1} ${k[0].y - 6} Q${(x1 + xN) / 2} ${top - 15} ${xN} ${k[k.length - 1].y - 6}" fill="none" stroke="${INK}" stroke-width="1.2"/>`);
    return 0;
  }
  const bot = Math.max.apply(null, k.map(n => n.y));
  o.push(`<path d="M${x1} ${k[0].y + 6} Q${(x1 + xN) / 2} ${bot + 15} ${xN} ${k[k.length - 1].y + 6}" fill="none" stroke="${INK}" stroke-width="1.2"/>`);
  return bot + 16;
}

function achtelPause(x, y0) {
  return `<circle cx="${x - 1.6}" cy="${y0 + 11.6}" r="1.7" fill="${INK}"/>` +
    `<path d="M${x - 1.6} ${y0 + 11.6} C${x - 0.2} ${y0 + 13.3} ${x + 1.3} ${y0 + 12.7} ${x + 2.5} ${y0 + 10.7}" fill="none" stroke="${INK}" stroke-width="1.1"/>` +
    `<line x1="${x + 2.5}" y1="${y0 + 10.7}" x2="${x - 0.6}" y2="${y0 + 19.2}" stroke="${INK}" stroke-width="1.4"/>`;
}
function viertelPause(x, y0) {
  return `<path d="M${x - 1.2} ${y0 + 7.5} C${x + 3} ${y0 + 11} ${x - 2.6} ${y0 + 12.8} ${x + 2.2} ${y0 + 17} C${x - 1.6} ${y0 + 15.6} ${x - 2.4} ${y0 + 18.4} ${x + 0.8} ${y0 + 20.6}" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>`;
}

/* Taktmuster. t = Position im Takt (0..1), d = Dauer, g = Balkengruppe */
const MUSTER2 = [
  { w: 3, ev: [{ t: 0, d: "q" }, { t: 0.5, d: "q" }] },
  { w: 3, ev: [{ t: 0, d: "e", g: 1 }, { t: 0.25, d: "e", g: 1 }, { t: 0.5, d: "e", g: 2 }, { t: 0.75, d: "e", g: 2 }] },
  { w: 2, ev: [{ t: 0, d: "er" }, { t: 0.25, d: "e" }, { t: 0.5, d: "er" }, { t: 0.75, d: "e" }], fest: true },
  { w: 2, ev: [{ t: 0, d: "q" }, { t: 0.5, d: "e", g: 1 }, { t: 0.75, d: "e", g: 1 }] },
  { w: 1, ev: [{ t: 0, d: "h" }] },
  { w: 1, ev: [{ t: 0, d: "qr" }, { t: 0.5, d: "q" }] },
  { w: 2, ev: [{ t: 0, d: "e", g: 1 }, { t: 0.25, d: "e", g: 1 }, { t: 0.5, d: "q" }] }
];
const MUSTER3 = [
  { w: 3, ev: [{ t: 0, d: "q" }, { t: 1 / 3, d: "q" }, { t: 2 / 3, d: "q" }] },
  { w: 2, ev: [{ t: 0, d: "h" }, { t: 2 / 3, d: "q" }] },
  { w: 2, ev: [{ t: 0, d: "qr" }, { t: 1 / 3, d: "q" }, { t: 2 / 3, d: "q" }] },
  { w: 1, ev: [{ t: 0, d: "hp" }] },
  { w: 2, ev: [{ t: 0, d: "q" }, { t: 1 / 3, d: "e", g: 1 }, { t: 0.5, d: "e", g: 1 }, { t: 2 / 3, d: "q" }] }
];
const SCHRITTE = [-2, -1, -1, 0, 0, 1, 1, 2];

function wahl(liste, rnd) {
  let summe = 0;
  liste.forEach(m => { summe += m.w; });
  let r = rnd() * summe;
  for (let i = 0; i < liste.length; i++) {
    r -= liste[i].w;
    if (r <= 0) return liste[i];
  }
  return liste[liste.length - 1];
}

function system(o, y0, s, anzahl, dreier, rnd, letzteSeite) {
  for (let i = 0; i < 5; i++) {
    o.push(`<line x1="56" y1="${y0 + i * 7}" x2="704" y2="${y0 + i * 7}" stroke="#4a473f" stroke-width="1"/>`);
  }
  o.push(`<line x1="56" y1="${y0}" x2="56" y2="${y0 + 28}" stroke="${INK}" stroke-width="1.1"/>`);
  o.push(`<use href="#gclef" x="52" y="${y0}"/>`);
  o.push(be(77, y0 + 14));

  const erste = (seite === 1 && s === 0);
  if (erste) {
    o.push(txt(94, y0 + 12.5, dreier ? "3" : "2", 15, ' text-anchor="middle" font-weight="700"'));
    o.push(txt(94, y0 + 26.5, "4", 15, ' text-anchor="middle" font-weight="700"'));
  }
  const inhaltX = erste ? 108 : 90;
  const mw = (704 - inhaltX) / 4;
  const ctx = { stufe: 2 + Math.floor(rnd() * 5) };
  const MU = dreier ? MUSTER3 : MUSTER2;
  const tiefen = [];   /* Unterkante je Takt — hält Dynamik/Gabeln kollisionsfrei */

  for (let m = 0; m < 4; m++) {
    const x0 = inhaltX + m * mw;
    const mu = wahl(MU, rnd);
    const vierAchtel = mu.ev.length === 4 && mu.ev.every(e => e.g);
    const festStufe = 2 + Math.floor(rnd() * 3);
    const stakkato = rnd() < 0.2;
    const koepfe = [];
    const gruppen = {};
    let tiefe = y0 + 34;

    mu.ev.forEach(ev => {
      const ex = +(x0 + 11 + ev.t * (mw - 24)).toFixed(1);
      if (ev.d === "er") { o.push(achtelPause(ex, y0)); tiefe = Math.max(tiefe, y0 + 21); return; }
      if (ev.d === "qr") { o.push(viertelPause(ex, y0)); tiefe = Math.max(tiefe, y0 + 22); return; }
      let stufe;
      if (mu.fest) { stufe = festStufe; }
      else {
        ctx.stufe = klemm(ctx.stufe + SCHRITTE[Math.floor(rnd() * SCHRITTE.length)], -2, 10);
        stufe = ctx.stufe;
      }
      const ey = +(y0 + 28 - stufe * 3.5).toFixed(1);
      const offen = (ev.d === "h" || ev.d === "hp");
      const info = { x: ex, y: ey, step: stufe };
      /* Hilfslinien unterhalb bzw. oberhalb des Systems */
      if (stufe <= -2) o.push(`<line x1="${ex - 6.5}" y1="${y0 + 35}" x2="${ex + 6.5}" y2="${y0 + 35}" stroke="${INK}" stroke-width="1"/>`);
      if (stufe >= 10) o.push(`<line x1="${ex - 6.5}" y1="${y0 - 7}" x2="${ex + 6.5}" y2="${y0 - 7}" stroke="${INK}" stroke-width="1"/>`);
      if (ev.g) { (gruppen[ev.g] = gruppen[ev.g] || []).push(info); }
      else { einzelHals(o, info, ev.d === "e"); }
      o.push(kopfM(ex, ey, offen));
      /* Staccato-Punkte auf Achtelgruppen — typisch für die Polka-Begleitung */
      if (stakkato && ev.g) {
        o.push(`<circle cx="${ex}" cy="${(stufe < 4 ? ey + 6.5 : ey - 6.5).toFixed(1)}" r="1.3" fill="${INK}"/>`);
      }
      if (ev.d === "hp") {
        o.push(`<circle cx="${ex + 8}" cy="${stufe % 2 === 0 ? ey - 3.5 : ey}" r="1.5" fill="${INK}"/>`);
      }
      tiefe = Math.max(tiefe, ey + 6);
      if (stufe >= 4 && !ev.g) tiefe = Math.max(tiefe, ey + 25);
      koepfe.push(info);
    });

    Object.keys(gruppen).forEach(k => { tiefe = Math.max(tiefe, balken(o, gruppen[k])); });
    if (vierAchtel && koepfe.length === 4 && rnd() < 0.3) tiefe = Math.max(tiefe, bogen(o, koepfe));
    tiefen.push(tiefe);

    const bx = +(x0 + mw).toFixed(1);
    if (letzteSeite && s === anzahl - 1 && m === 3) {
      o.push(`<line x1="698.5" y1="${y0}" x2="698.5" y2="${y0 + 28}" stroke="${INK}" stroke-width="1.1"/>`);
      o.push(`<rect x="701" y="${y0}" width="3" height="28" fill="${INK}"/>`);
    } else {
      o.push(`<line x1="${bx}" y1="${y0}" x2="${bx}" y2="${y0 + 28}" stroke="${INK}" stroke-width="1"/>`);
    }
  }

  /* Dynamik unter dem ersten System — unter allem, was dort hängt */
  if (s === 0) {
    const dyn = ["mf", "f", "mp", "p"][Math.floor(rnd() * 4)];
    o.push(txt(inhaltX + 2, Math.max(y0 + 43, tiefen[0] + 11), dyn, 13, ' font-style="italic" font-weight="700"', "#2e2c26"));
  }
  /* Probebuchstabe am Systemanfang */
  if ((s === 3 || s === 7) && !(seite === 1 && s === 0)) {
    const idx = (seite - 1) * 2 + (s === 3 ? 0 : 1);
    const buchst = String.fromCharCode(65 + idx);
    o.push(`<rect x="57" y="${y0 - 26}" width="18" height="17" rx="2" fill="none" stroke="#8d887c" stroke-width="1.1"/>`);
    o.push(txt(66, y0 - 13, buchst, 11.5, ' text-anchor="middle" font-weight="700"'));
  }
  /* gelegentlich eine Crescendo-Gabel — nur, wenn unter Takt 2 Platz ist */
  if (s > 0 && rnd() < 0.18) {
    const cy = Math.max(y0 + 38, tiefen[1] + 8);
    if (cy <= y0 + 54) {
      const cx1 = +(inhaltX + mw + 12).toFixed(1), cx2 = +(inhaltX + 2 * mw - 12).toFixed(1);
      o.push(`<line x1="${cx1}" y1="${cy}" x2="${cx2}" y2="${cy - 3.5}" stroke="#4a473f" stroke-width="1"/>`);
      o.push(`<line x1="${cx1}" y1="${cy}" x2="${cx2}" y2="${cy + 3.5}" stroke="#4a473f" stroke-width="1"/>`);
    }
  }
}

function zeichneSeite() {
  const st = STUECKE[stueck];
  const dreier = st.g === "Walzer";
  const rnd = mulberry(90001 + stueck * 7919 + seite * 131);
  const o = [];
  o.push(`<defs><g id="gclef">${CLEF}</g></defs>`);
  o.push(`<rect x="0" y="0" width="760" height="1075" fill="#fcfcfb"/>`);

  let oben, anzahl;
  if (seite === 1) {
    o.push(`<text x="56" y="62" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="10.5" letter-spacing="2.4" fill="#6b675d">TENORHORN IN B</text>`);
    o.push(txt(380, 102, st.t, 27, ' text-anchor="middle" font-weight="600"'));
    const unter = st.k ? `${st.g} — ${st.k}` : st.g;
    o.push(txt(704, 128, unter, 13, ' text-anchor="end" font-style="italic"', "#3a382f"));
    /* Tempoangabe: Viertelnote = Zahl */
    o.push(`<ellipse cx="61" cy="149" rx="3.2" ry="2.4" transform="rotate(-14 61 149)" fill="${INK}"/>`);
    o.push(`<line x1="63.9" y1="148" x2="63.9" y2="130" stroke="${INK}" stroke-width="1.2"/>`);
    o.push(txt(71, 152, `= ${TEMPO[st.g]}`, 12.5));
    oben = 178; anzahl = 10;
  } else {
    o.push(txt(380, 56, `${st.t} — Tenorhorn`, 13, ' text-anchor="middle" font-style="italic"', "#6b675d"));
    oben = 104; anzahl = 11;
  }

  const schritt = (1075 - 46 - 28 - oben) / (anzahl - 1);
  const letzteSeite = seite === SEITEN;
  for (let s = 0; s < anzahl; s++) {
    system(o, Math.round(oben + s * schritt), s, anzahl, dreier, rnd, letzteSeite);
  }
  o.push(txt(380, 1050, `– ${seite} –`, 12.5, ' text-anchor="middle"', "#55524b"));

  $("blatt").innerHTML = o.join("");
}

/* ════════════════════════════════════════════════════════════════
   STATUS, BLÄTTERN
   ════════════════════════════════════════════════════════════════ */
const statusEl = $("status");
let statusTimer = null;
function statusZeigen() {
  $("statusTitel").textContent = STUECKE[stueck].t;
  $("statusMeta").textContent = `Tenorhorn · Seite ${seite}/${SEITEN}`;
  statusEl.classList.add("da");
  /* auch bei reduzierter Bewegung wieder ausblenden — das Verschwinden
     ist dann schlicht hart statt weich */
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.remove("da"), 2600);
}
function geheZu(p) {
  const z = klemm(p, 1, SEITEN);
  if (z !== seite) { seite = z; zeichneSeite(); }
  statusZeigen();
}
$("buehne").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (e.clientX - r.left < r.width / 2) geheZu(seite - 1); else geheZu(seite + 1);
});
window.addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") geheZu(seite - 1);
  if (e.key === "ArrowRight") geheZu(seite + 1);
});

/* ════════════════════════════════════════════════════════════════
   PANELS: drei Knöpfe schalten ihre Overlays ein/aus
   ════════════════════════════════════════════════════════════════ */
const PANEL = {
  noten:    { k: $("kNoten"),    el: $("bibliothek") },
  metronom: { k: $("kMetronom"), el: $("wMetro") },
  stimm:    { k: $("kStimm"),    el: $("wStimm") }
};
function schalte(name, erzwinge) {
  const p = PANEL[name];
  const offen = (erzwinge !== undefined) ? erzwinge : p.el.hidden;
  p.el.hidden = !offen;
  p.k.setAttribute("aria-pressed", offen ? "true" : "false");
}
$("kNoten").addEventListener("click", () => schalte("noten"));
$("kMetronom").addEventListener("click", () => schalte("metronom"));
$("kStimm").addEventListener("click", () => schalte("stimm"));
document.querySelectorAll(".schliessen").forEach(b => {
  b.addEventListener("click", () => schalte(b.dataset.ziel, false));
});

/* ════════════════════════════════════════════════════════════════
   METRONOM — läuft beim Start, Taktpunkte pulsieren dezent
   ════════════════════════════════════════════════════════════════ */
const mStart = $("mStart"), mZahl = $("mZahl"), p1 = $("p1"), p2 = $("p2");
let bpm = 112, laeuft = true, schlag = 0, timerId = null;

function puls() {
  schlag = (schlag === 1) ? 2 : 1;
  p1.className = (schlag === 1) ? "an eins" : "";
  p2.className = (schlag === 2) ? "an zwei" : "";
}
function neuStart() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (laeuft) {
    if (RM) { p1.className = "an eins"; p2.className = ""; }
    else { schlag = 0; puls(); timerId = setInterval(puls, Math.round(60000 / bpm)); }
  } else {
    p1.className = ""; p2.className = "";
  }
  document.body.classList.toggle("laeuft", laeuft);
  mStart.setAttribute("aria-pressed", laeuft ? "true" : "false");
  mStart.setAttribute("aria-label", laeuft ? "Metronom stoppen" : "Metronom starten");
}
function setzeBpm(n) {
  bpm = klemm(Math.round(n), 30, 240);
  mZahl.textContent = String(bpm);
  if (laeuft) neuStart();
}
mStart.addEventListener("click", () => { laeuft = !laeuft; neuStart(); });
$("mM1").addEventListener("click", () => setzeBpm(bpm - 1));
$("mP1").addEventListener("click", () => setzeBpm(bpm + 1));
$("mM10").addEventListener("click", () => setzeBpm(bpm * 0.9));
$("mP10").addEventListener("click", () => setzeBpm(bpm * 1.1));

/* ════════════════════════════════════════════════════════════════
   STIMMGERÄT-SKALA — feine Striche, Nadel bei +2 (fast rein)
   ════════════════════════════════════════════════════════════════ */
function baueSkala() {
  const t = [];
  t.push(`<rect x="${(110 - 5 * 1.8).toFixed(1)}" y="9" width="${(10 * 1.8).toFixed(1)}" height="22" fill="#f1efe8"/>`);
  for (let c = -50; c <= 50; c += 5) {
    const x = (110 + c * 1.8).toFixed(1);
    let y1 = 15, y2 = 25, f = "#ccc8be", w = 0.8;
    if (c === 0) { y1 = 7; y2 = 33; f = "#8d887c"; w = 1.1; }
    else if (c % 25 === 0) { y1 = 11; y2 = 29; f = "#b4b0a5"; w = 1; }
    t.push(`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${f}" stroke-width="${w}"/>`);
  }
  const et = ' font-family="-apple-system, \'Segoe UI\', sans-serif" font-size="7" fill="#8d887c" text-anchor="middle"';
  t.push(`<text x="20" y="42"${et}>−50</text>`);
  t.push(`<text x="110" y="42"${et}>0</text>`);
  t.push(`<text x="200" y="42"${et}>+50</text>`);
  /* Nadel knapp rechts der Mitte: +2 */
  t.push(`<g transform="translate(${(110 + 2 * 1.8).toFixed(2)} 0)"><g class="wobbel"><line x1="0" y1="6" x2="0" y2="34" stroke="#1d1b17" stroke-width="1.8" stroke-linecap="round"/></g></g>`);
  $("sSkala").innerHTML = t.join("");
}

/* ════════════════════════════════════════════════════════════════
   BIBLIOTHEK — Liste, Suche, Auswahl
   ════════════════════════════════════════════════════════════════ */
const liste = $("bibListe");
const suche = $("suche");
function filterAnwenden() {
  const q = suche.value.trim().toLowerCase();
  Array.prototype.forEach.call(liste.children, b => {
    b.hidden = q !== "" && b.querySelector(".st").textContent.toLowerCase().indexOf(q) === -1;
  });
}
function baueBibliothek() {
  liste.innerHTML = "";
  STUECKE.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "stueck" + (i === stueck ? " aktiv" : "");
    b.innerHTML = `<span class="st">${s.t}</span><span class="sg">${s.g}</span>`;
    b.addEventListener("click", () => {
      if (i !== stueck) { stueck = i; seite = 1; zeichneSeite(); baueBibliothek(); }
      schalte("noten", false);
      statusZeigen();
    });
    liste.appendChild(b);
  });
  filterAnwenden();
}
suche.addEventListener("input", filterAnwenden);

/* ── Start ──────────────────────────────────────────────────────── */
baueSkala();
baueBibliothek();
zeichneSeite();
statusZeigen();
neuStart();
</script>
</body>
</html>
