# Deployt nach Vercel über die Vercel-CLI statt über die Git-Anbindung:
# Die Git-Anbindung verlangt für Repos einer GitHub-Organisation den Pro-Tarif,
# die CLI geht auch mit Hobby. Läuft erst, wenn CI auf main grün ist.
# Einmalig nötig: Repo-Secret VERCEL_TOKEN (vercel.com → Account Settings → Tokens).
name: Deploy (Vercel)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: vercel
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Ohne Token nichts tun
        if: env.VERCEL_TOKEN == ''
        run: echo "Secret VERCEL_TOKEN fehlt – Deploy übersprungen."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with: { node-version-file: .node-version }
      - name: Projekt verknüpfen (legt es beim ersten Mal an)
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest link --yes --project uebe-app --token "$VERCEL_TOKEN"
      - name: Produktion deployen
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
